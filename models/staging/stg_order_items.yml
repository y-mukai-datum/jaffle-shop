models:
  - name: stg_order_items
    description: 注文を構成する個別のフードとドリンクアイテム。アイテムごとに1行。
    columns:
      - name: order_item_id
        description: 各注文アイテムのユニークキー
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: 各注文アイテムが属する対応する注文
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
