models:
  - name: stg_supplies
    description: >
      基本的なクレンジングと変換を適用した仕入れ費用データのリスト。

      仕入れごとではなく、仕入れコストごとに1行。仕入れコストが変動すると新しいUUIDで新しい行が作成される。したがって、supply_idごとに複数行存在する可能性がある。
    columns:
      - name: supply_uuid
        description: コストごとの仕入れのユニークキー
        data_tests:
          - not_null
          - unique
