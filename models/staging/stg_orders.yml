models:
  - name: stg_orders
    description: 基本的なクレンジングと変換を適用した注文データ。注文ごとに1行。
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "order_total - tax_paid = subtotal"
    columns:
      - name: order_id
        description: 各注文のユニークキー
        data_tests:
          - not_null
          - unique
