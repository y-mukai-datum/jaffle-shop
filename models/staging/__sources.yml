version: 2

sources:
  - name: ecom
    schema: raw
    description: Jaffle ShopのEコマースデータ
    tables:
      - name: raw_customers
        description: 1つ以上の商品を購入した人ごとに1レコード
      - name: raw_orders
        description: 注文ごとに1レコード（1つ以上の注文アイテムで構成）
        loaded_at_field: ordered_at
      - name: raw_items
        description: 注文に含まれるアイテム
      - name: raw_stores
        loaded_at_field: opened_at
      - name: raw_products
        description: 店舗で販売されるアイテムのSKUごとに1レコード
      - name: raw_supplies
        description: 店舗で販売されるアイテムのSKUごとの仕入れに対して1レコード
