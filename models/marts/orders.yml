models:
  - name: orders
    description: 注文概要データマート。各注文の主要情報を提供。顧客の初回注文かどうか、フード/ドリンクアイテムの内訳を含む。注文ごとに1行。
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "order_items_subtotal = subtotal"
      - dbt_utils.expression_is_true:
          expression: "order_total = subtotal + tax_paid"
    columns:
      - name: order_id
        description: 注文マートのユニークキー
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: 注文を行った顧客への外部キー
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_total
        description: 税込みの注文合計金額（USD）
      - name: ordered_at
        description: 注文が行われたタイムスタンプ
      - name: order_cost
        description: 注文を満たすための仕入れ費用の合計
      - name: is_food_order
        description: この注文にフード商品が含まれているかを示すブール値
      - name: is_drink_order
        description: この注文にドリンク商品が含まれているかを示すブール値

unit_tests:
  - name: test_order_items_compute_to_bools_correctly
    description: "Test that the counts of drinks and food orders convert to booleans properly."
    model: orders
    given:
      - input: ref('order_items')
        rows:
          - {
              order_id: 1,
              order_item_id: 1,
              is_drink_item: false,
              is_food_item: true,
            }
          - {
              order_id: 1,
              order_item_id: 2,
              is_drink_item: true,
              is_food_item: false,
            }
          - {
              order_id: 2,
              order_item_id: 3,
              is_drink_item: false,
              is_food_item: true,
            }
      - input: ref('stg_orders')
        rows:
          - { order_id: 1 }
          - { order_id: 2 }
    expect:
      rows:
        - {
            order_id: 1,
            count_food_items: 1,
            count_drink_items: 1,
            is_drink_order: true,
            is_food_order: true,
          }
        - {
            order_id: 2,
            count_food_items: 1,
            count_drink_items: 0,
            is_drink_order: false,
            is_food_order: true,
          }

semantic_models:
  - name: orders
    defaults:
      agg_time_dimension: ordered_at
    description: |
      注文ファクトテーブル。注文粒度で1注文1行のテーブル。
    model: ref('orders')
    entities:
      - name: order_id
        type: primary
      - name: location
        type: foreign
        expr: location_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: ordered_at
        expr: ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: order_total_dim
        type: categorical
        expr: order_total
      - name: is_food_order
        type: categorical
      - name: is_drink_order
        type: categorical
      - name: customer_order_number
        type: categorical
    measures:
      - name: order_total
        description: 税込みの注文合計金額
        agg: sum
      - name: order_count
        expr: 1
        agg: sum
      - name: tax_paid
        description: 各注文の税額合計
        agg: sum
      - name: order_cost
        description: 各注文アイテムのコスト。注文アイテムごとの仕入れコストの合計として計算される。
        agg: sum

metrics:
  - name: order_total
    description: 注文合計金額の合計。税金 + 売上を含む。
    type: simple
    label: 注文合計
    type_params:
      measure: order_total
  - name: new_customer_orders
    description: 新規顧客の初回注文数
    label: 新規顧客
    type: simple
    type_params:
      measure: order_count
    filter: |
      {{ Dimension('order_id__customer_order_number') }} = 1
  - name: large_orders
    description: "注文合計が20を超える注文の数"
    type: simple
    label: 大口注文
    type_params:
      measure: order_count
    filter: |
      {{ Dimension('order_id__order_total_dim') }} >= 20
  - name: orders
    description: 注文数
    label: 注文数
    type: simple
    type_params:
      measure: order_count
  - name: food_orders
    description: フード商品を含む注文の数
    label: フード注文
    type: simple
    type_params:
      measure: order_count
    filter: |
      {{ Dimension('order_id__is_food_order') }} = true
  - name: drink_orders
    description: ドリンク商品を含む注文の数
    label: ドリンク注文
    type: simple
    type_params:
      measure: order_count
    filter: |
      {{ Dimension('order_id__is_drink_order') }} = true

saved_queries:
  - name: order_metrics
    query_params:
      metrics:
        - orders
        - new_customer_orders
        - order_total
        - food_orders
        - drink_orders
      group_by:
        - TimeDimension('metric_time', 'day')
    exports:
      - name: order_metrics
        config:
          export_as: table
