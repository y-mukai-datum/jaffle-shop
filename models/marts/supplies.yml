semantic_models:
  #セマンティックモデルの名前
  - name: supplies
    description: |
      仕入れディメンションテーブル。仕入れと商品の組み合わせ粒度で1行のテーブル。
    #dbtモデルとスキーマの名前
    model: ref('supplies')
    #エンティティ。通常はテーブルのキーに対応する。
    entities:
      - name: supply
        type: primary
        expr: supply_uuid
    #ディメンション。カテゴリカルまたは時間のいずれか。メトリクスに追加のコンテキストを加える。典型的なクエリパターンは「ディメンション別メトリクス」。
    dimensions:
      - name: supply_id
        type: categorical
      - name: product_id
        type: categorical
      - name: supply_name
        type: categorical
      - name: supply_cost
        type: categorical
      - name: is_perishable_supply
        type: categorical
