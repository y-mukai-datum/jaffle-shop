semantic_models:
  - name: locations
    description: |
      店舗ディメンションテーブル。店舗粒度で1店舗1行のテーブル。
    model: ref('locations')
    defaults:
      agg_time_dimension: opened_date
    entities:
      - name: location
        type: primary
        expr: location_id
    dimensions:
      - name: location_name
        type: categorical
      - name: opened_date
        expr: opened_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: average_tax_rate
        description: 平均税率
        expr: tax_rate
        agg: average
