models:
  - name: customers
    description: 顧客概要データマート。各ユニーク顧客の主要情報を提供。顧客ごとに1行。
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "lifetime_spend_pretax + lifetime_tax_paid = lifetime_spend"
    columns:
      - name: customer_id
        description: 顧客マートのユニークキー
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: 顧客のフルネーム
      - name: count_lifetime_orders
        description: 顧客が今までに注文した累計注文数
      - name: first_ordered_at
        description: 顧客が初回注文を行ったタイムスタンプ
      - name: last_ordered_at
        description: 顧客の最新注文のタイムスタンプ
      - name: lifetime_spend_pretax
        description: 顧客が行った全注文の税抜き小計の合計
      - name: lifetime_tax_paid
        description: 顧客が行った全注文の税額部分の合計
      - name: lifetime_spend
        description: 顧客が今までに行った全注文合計（税込み）の合計
      - name: customer_type
        description: 'new'または'returning'のいずれか。顧客が複数回注文しているか、初回注文のみかを示す。
        data_tests:
          - accepted_values:
              values: ["new", "returning"]

semantic_models:
  - name: customers
    defaults:
      agg_time_dimension: first_ordered_at
    description: |
      顧客粒度のマートテーブル。
    model: ref('customers')
    entities:
      - name: customer
        expr: customer_id
        type: primary
    dimensions:
      - name: customer_name
        type: categorical
      - name: customer_type
        type: categorical
      - name: first_ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: last_ordered_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: customers
        description: ユニーク顧客数
        agg: count_distinct
        expr: customer_id
      - name: count_lifetime_orders
        description: 顧客あたりの累計注文数
        agg: sum
      - name: lifetime_spend_pretax
        description: 顧客の税抜き累計支払額
        agg: sum
      - name: lifetime_spend
        agg: sum
        description: 顧客の税込み累計支払額

metrics:
  - name: lifetime_spend_pretax
    description: 顧客の税抜き累計支払額
    label: 税抜きLTV
    type: simple
    type_params:
      measure: lifetime_spend_pretax
  - name: count_lifetime_orders
    description: 累計注文数
    label: 累計注文数
    type: simple
    type_params:
      measure: count_lifetime_orders
  - name: average_order_value
    description: 税抜きLTV / 注文数
    label: 平均注文額
    type: derived
    type_params:
      metrics:
        - count_lifetime_orders
        - lifetime_spend_pretax
      expr: lifetime_spend_pretax / count_lifetime_orders

saved_queries:
  - name: customer_order_metrics
    query_params:
      metrics:
        - count_lifetime_orders
        - lifetime_spend_pretax
        - average_order_value
      group_by:
        - Entity('customer')
    exports:
      - name: customer_order_metrics
        config:
          export_as: table
