models:
  - name: order_items
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - relationships:
              to: ref('orders')
              field: order_id

unit_tests:
  - name: test_supply_costs_sum_correctly
    description: "Test that the counts of drinks and food orders convert to booleans properly."
    model: order_items
    given:
      - input: ref('stg_supplies')
        rows:
          - { product_id: 1, supply_cost: 4.50 }
          - { product_id: 2, supply_cost: 3.50 }
          - { product_id: 2, supply_cost: 5.00 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1 }
          - { product_id: 2 }
      - input: ref('stg_order_items')
        rows:
          - { order_id: 1, product_id: 1 }
          - { order_id: 2, product_id: 2 }
          - { order_id: 2, product_id: 2 }
      - input: ref('stg_orders')
        rows:
          - { order_id: 1 }
          - { order_id: 2 }
    expect:
      rows:
        - { order_id: 1, product_id: 1, supply_cost: 4.50 }
        - { order_id: 2, product_id: 2, supply_cost: 8.50 }
        - { order_id: 2, product_id: 2, supply_cost: 8.50 }

semantic_models:
  - name: order_item
    defaults:
      agg_time_dimension: ordered_at
    description: |
      各注文に含まれる商品アイテム。注文アイテム粒度で1アイテム1行のテーブル。
    model: ref('order_items')
    entities:
      - name: order_item
        type: primary
        expr: order_item_id
      - name: order_id
        type: foreign
        expr: order_id
      - name: product
        type: foreign
        expr: product_id
    dimensions:
      - name: ordered_at
        expr: ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: is_food_item
        type: categorical
      - name: is_drink_item
        type: categorical
    measures:
      - name: revenue
        description: 各注文アイテムから生じる売上。注文内の各商品に関連する売上の合計として計算される。
        agg: sum
        expr: product_price
      - name: food_revenue
        description: 各注文アイテムから生じる売上。注文内の各商品に関連する売上の合計として計算される。
        agg: sum
        expr: case when is_food_item then product_price else 0 end
      - name: drink_revenue
        description: 各注文アイテムから生じる売上。注文内の各商品に関連する売上の合計として計算される。
        agg: sum
        expr: case when is_drink_item then product_price else 0 end
      - name: median_revenue
        description: 各注文アイテムから生じる売上の中央値
        agg: median
        expr: product_price

metrics:
  # シンプルメトリクス
  - name: revenue
    description: 各注文アイテムの商品売上の合計。税抜き。
    type: simple
    label: 売上
    type_params:
      measure: revenue
  - name: order_cost
    description: 各注文アイテムのコストの合計
    label: 注文コスト
    type: simple
    type_params:
      measure: order_cost
  - name: median_revenue
    description: 各注文アイテムの売上の中央値。税抜き。
    type: simple
    label: 売上中央値
    type_params:
      measure: median_revenue
  - name: food_revenue
    description: 各注文におけるフード商品からの売上
    label: フード売上
    type: simple
    type_params:
      measure: food_revenue
  - name: drink_revenue
    description: 各注文におけるドリンク商品からの売上
    label: ドリンク売上
    type: simple
    type_params:
      measure: drink_revenue

  # 比率メトリクス
  - name: food_revenue_pct
    description: 注文売上におけるフード商品の割合（%）
    label: フード売上比率
    type: ratio
    type_params:
      numerator: food_revenue
      denominator: revenue
  - name: drink_revenue_pct
    description: 注文売上におけるドリンク商品の割合（%）
    label: ドリンク売上比率
    type: ratio
    type_params:
      numerator: drink_revenue
      denominator: revenue

  # 派生メトリクス
  - name: revenue_growth_mom
    description: "1ヶ月前と比較した売上の成長率（%）。税抜き"
    type: derived
    label: 売上成長率（前月比）
    type_params:
      expr: (current_revenue - revenue_prev_month)*100/revenue_prev_month
      metrics:
        - name: revenue
          alias: current_revenue
        - name: revenue
          offset_window: 1 month
          alias: revenue_prev_month
  - name: order_gross_profit
    description: 各注文の粗利益
    type: derived
    label: 注文粗利益
    type_params:
      expr: revenue - cost
      metrics:
        - name: revenue
        - name: order_cost
          alias: cost

  # 累積メトリクス
  - name: cumulative_revenue
    description: 全注文の累積売上
    label: 累積売上（全期間）
    type: cumulative
    type_params:
      measure: revenue

saved_queries:
  - name: revenue_metrics
    query_params:
      metrics:
        - revenue
        - food_revenue
        - drink_revenue
      group_by:
        - TimeDimension('metric_time', 'day')
    exports:
      - name: revenue_metrics
        config:
          export_as: table
